<div class="hero-banner">
  <img
    [src]="(tenantConfig.imageUrl?.trim()) || defaultBannerUrl"
    [attr.alt]="'COMMON.BANNER_ALT' | translate"
    class="hero-banner-image" />
  <div class="hero-banner-overlay">
    <img
      class="hero-banner-logo"
      [src]="(tenantConfig.logoUrl?.trim()) || defaultLogoUrl"
      [attr.alt]="'COMMON.LOGO_ALT' | translate" />
    <h1 class="hero-title">
      <span class="hero-title__prefix">{{ 'GP.TITLE_PREFIX' | translate }}</span>
      @if (gpTitleName) {
        <span class="hero-title__name">{{ gpTitleName }}</span>
      }
    </h1>
    @if (talukaDistrictLine) {
      <p class="hero-meta-line">{{ talukaDistrictLine }}</p>
    }
  </div>
</div>
