<ng-container *ngFor="let sec of sections; trackBy: trackBySection">
  <app-certificate-section-head
    [sectionId]="'certificate-sec-' + sec.category"
    [icon]="sectionIcon(sec.category)"
    [titleKey]="sectionTitleKey(sec.category)" />
  <ng-container *ngFor="let row of sec.types; trackBy: trackByRow">
    <app-certificate-row [row]="row" (open)="openItem.emit($event)" />
  </ng-container>
</ng-container>
